# dreamworld_gs services. Paths are relative to this file, so the stack works
# from any working directory. Driven by the justfile — see `just --list`.
#
#   prefect    long-running: job orchestration + UI on :4200
#   vlm        long-running: plans camera trajectories, captions views
#   viewer     long-running: WebGL splat viewer for every generated world
#   panoviewer long-running: 360 viewer for the input panoramas
#   generator  long-running: waits for jobs, runs the 6-stage pipeline
#   rmfsim     long-running: the building simulated under RMF, over noVNC
#   editor     long-running: the traffic editor (map authoring), over noVNC
#   worldjobs  long-running: serves world generation to the job queue
#
# Everything about one building lives under assets/projects/<project>/ —
# maps/ (authored), worlds/ (generated), panos/ (captured), splats/ (built) —
# and every service mounts that one tree, so a project is a single directory to
# copy, back up or hand over.
#
# Nothing here reaches the network at runtime: model weights are mounted from
# assets/ and the containers run with HuggingFace offline mode set.

name: dreamworld

x-as-caller: &as-caller
  # run as the invoking user so outputs aren't root-owned; that uid has no
  # entry in the image's passwd, which some libraries insist on reading
  user: "${DW_UID:-1000}:${DW_GID:-1000}"
  volumes:
    - /etc/passwd:/etc/passwd:ro
  environment:
    HOME: /tmp

services:

  prefect:
    image: prefecthq/prefect:3.8.1-python3.11
    container_name: dreamworld-prefect
    command: prefect server start --host 0.0.0.0 --ui
    ports:
      - "${DW_PREFECT_PORT:-4200}:4200"
    volumes:
      - ./assets/prefect:/prefect
    environment:
      PREFECT_HOME: /prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # the browser talks to the API on the host, not inside the container
      PREFECT_SERVER_UI_API_URL: http://localhost:${DW_PREFECT_PORT:-4200}/api
      # the server unpacks its UI bundle on first start; site-packages is
      # root-owned and this runs as the caller, so send it to the volume
      PREFECT_UI_STATIC_DIRECTORY: /prefect/ui
    user: "${DW_UID:-1000}:${DW_GID:-1000}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"]
      interval: 5s
      timeout: 5s
      start_period: 2m
      retries: 5
    restart: unless-stopped
  vlm:
    image: vllm/vllm-openai:v0.11.0
    container_name: dreamworld-vlm
    # host networking: the generator reaches this on 127.0.0.1:8000
    network_mode: host
    ipc: host
    volumes:
      - ./assets/hf:/hf:ro
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --port=8000
      - --host=127.0.0.1
      - --max-model-len=32768
      - --trust-remote-code
      - --gpu-memory-utilization=0.80
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]   # the generator uses the rest
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v1/models"]
      interval: 10s
      timeout: 5s
      start_period: 15m           # first start loads ~17GB from disk
      retries: 3
    restart: unless-stopped

  viewer:
    build:
      context: ./docker/splat-viewer
      dockerfile: splat-viewer.Dockerfile
    image: dreamworld/splat-viewer:latest
    container_name: dreamworld-viewer
    ports:
      - "${DW_VIEWER_PORT:-8081}:80"
    volumes:
      - ./assets/projects:/usr/share/nginx/html/files:ro
    restart: unless-stopped

  panoviewer:
    build:
      context: ./docker/pano-viewer
      dockerfile: pano-viewer.Dockerfile
    image: dreamworld/pano-viewer:latest
    container_name: dreamworld-panoviewer
    ports:
      - "${DW_PANO_PORT:-8082}:80"
    volumes:
      - ./assets/projects:/usr/share/nginx/html/files:ro
    restart: unless-stopped

  # The RMF side: the building as a simulation, and the editor that authors it.
  # Both are Qt apps with no headless mode, so each publishes its own screen as
  # a web page (see docker/rmf-tools/with_display.sh). They share one image and
  # differ only by role. DW_PROJECT picks which project they open.
  rmfsim:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: rmf-tools/rmf-tools.Dockerfile
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-rmfsim
    command: ["sim", "${DW_PROJECT:-multilevel_office}"]
    ports:
      - "${DW_RMF_PORT:-8083}:8080"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
      # a second gz on this host (another sim, another render) must not be
      # discovered as part of this one
      GZ_PARTITION: dreamworld_rmf
      GZ_IP: 127.0.0.1
    restart: unless-stopped

  editor:
    <<: *as-caller
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-editor
    command: ["editor", "${DW_PROJECT:-multilevel_office}"]
    ports:
      - "${DW_EDITOR_PORT:-8084}:8080"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      # writable: editing a map is the point
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
    depends_on:
      - rmfsim                    # only to order the shared image build
    restart: unless-stopped

  # World generation needs Gazebo rather than CUDA, so it is served from the
  # rmf-tools image while the splat flows are served from the generator. Both
  # register with the same Prefect server, so every operation in this repo is
  # one queue at :4200.
  worldjobs:
    <<: *as-caller
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-worldjobs
    command: ["jobs"]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      # on the compose network, so the server is a service name, not localhost
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_HOME: /tmp/prefect
    depends_on:
      prefect:
        condition: service_healthy
      rmfsim:
        condition: service_started   # only to order the shared image build
    restart: unless-stopped

  generator:
    <<: *as-caller
    build:
      context: ./docker/splat-generator
      dockerfile: splat-generator.Dockerfile
    image: dreamworld/splat-generator:latest
    network_mode: host            # to reach the vlm
    shm_size: 32gb
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/models:/assets/models:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/workspace/projects
    environment:
      HOME: /tmp
      # Every card except 0, which the VLM holds. Reconstructions take one
      # each and run one per device, so this also sets how wide a batch goes;
      # `just` reads the same variable to size HY-World's rank count, since
      # that shards across every visible GPU and would otherwise broadcast
      # from ranks torchrun never launched.
      CUDA_VISIBLE_DEVICES: "${DW_GPU_IDS:-1,2,3,4,5,6,7}"
      PREFECT_API_URL: http://127.0.0.1:${DW_PREFECT_PORT:-4200}/api
      PREFECT_HOME: /tmp/prefect
    depends_on:
      prefect:
        condition: service_healthy
      # Started, not healthy. Only generate-world talks to the VLM — the
      # single-panorama generative path — and it needs it when a job runs, not
      # when this container boots. Gating on health made every reconstruction
      # wait on a 17 GB model load that none of them use.
      vlm:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
