# dreamworld_gs services. Paths are relative to this file, so the stack works
# from any working directory. Driven by the justfile — see `just --list`.
#
#   prefect    long-running: job orchestration + UI on :4200
#   vlm        long-running: plans camera trajectories, captions views
#   viewer     long-running: WebGL splat viewer for every generated world
#   panoviewer long-running: 360 viewer for the input panoramas
#   generator  long-running: waits for jobs, runs the 6-stage pipeline
#   rmfsim     long-running: the building simulated under RMF, over noVNC
#   editor     long-running: the traffic editor (map authoring), over noVNC
#   worldjobs  long-running: serves world generation to the job queue
#
# Everything about one building lives under assets/projects/<project>/ —
# maps/ (authored), worlds/ (generated), panos/ (captured), splats/ (built) —
# and every service mounts that one tree, so a project is a single directory to
# copy, back up or hand over.
#
# Nothing here reaches the network at runtime: model weights are mounted from
# assets/ and the containers run with HuggingFace offline mode set.

name: dreamworld

x-as-caller: &as-caller
  # run as the invoking user so outputs aren't root-owned; that uid has no
  # entry in the image's passwd, which some libraries insist on reading
  user: "${DW_UID:-1000}:${DW_GID:-1000}"
  volumes:
    - /etc/passwd:/etc/passwd:ro
  environment:
    HOME: /tmp

services:

  prefect:
    image: prefecthq/prefect:3.8.1-python3.11
    container_name: dreamworld-prefect
    command: prefect server start --host 0.0.0.0 --ui
    ports:
      - "${DW_PREFECT_PORT:-4200}:4200"
    volumes:
      - ./assets/prefect:/prefect
    environment:
      PREFECT_HOME: /prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # the browser talks to the API on the host, not inside the container
      PREFECT_SERVER_UI_API_URL: http://localhost:${DW_PREFECT_PORT:-4200}/api
      # the server unpacks its UI bundle on first start; site-packages is
      # root-owned and this runs as the caller, so send it to the volume
      PREFECT_UI_STATIC_DIRECTORY: /prefect/ui
    user: "${DW_UID:-1000}:${DW_GID:-1000}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')"]
      interval: 5s
      timeout: 5s
      start_period: 2m
      retries: 5
    restart: unless-stopped
  vlm:
    image: vllm/vllm-openai:v0.11.0
    container_name: dreamworld-vlm
    # host networking: the generator reaches this on 127.0.0.1:8000
    network_mode: host
    ipc: host
    volumes:
      - ./assets/hf:/hf:ro
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --port=8000
      - --host=127.0.0.1
      - --max-model-len=32768
      - --trust-remote-code
      - --gpu-memory-utilization=0.80
      # Tool calling, for the interactive mission agent. vllm serves tools only
      # when both are set: without them an agent's first tool call comes back
      # 400 '"auto" tool choice requires --enable-auto-tool-choice'. Harmless to
      # the trajectory planner, which never calls a tool.
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # the generator uses the rest (DW_GPU_IDS)
              device_ids: ["${DW_VLM_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v1/models"]
      interval: 10s
      timeout: 5s
      start_period: 15m           # first start loads ~17GB from disk
      retries: 3
    restart: unless-stopped

  viewer:
    build:
      context: ./docker/splat-viewer
      dockerfile: splat-viewer.Dockerfile
    image: dreamworld/splat-viewer:latest
    container_name: dreamworld-viewer
    ports:
      - "${DW_VIEWER_PORT:-8081}:80"
    volumes:
      - ./assets/projects:/usr/share/nginx/html/files:ro
    restart: unless-stopped

  panoviewer:
    build:
      context: ./docker/pano-viewer
      dockerfile: pano-viewer.Dockerfile
    image: dreamworld/pano-viewer:latest
    container_name: dreamworld-panoviewer
    ports:
      - "${DW_PANO_PORT:-8082}:80"
    volumes:
      - ./assets/projects:/usr/share/nginx/html/files:ro
    restart: unless-stopped

  # The RMF side: the building as a simulation, and the editor that authors it.
  # Both are Qt apps with no headless mode, so each publishes its own screen as
  # a web page (see docker/rmf-tools/with_display.sh). They share one image and
  # differ only by role. DW_PROJECT picks which project they open.
  rmfsim:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: rmf-tools/rmf-tools.Dockerfile
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-rmfsim
    command: ["sim", "${DW_PROJECT:-multilevel_office}"]
    # The galaxea bridge joins this container's network AND ipc namespaces, and
    # a donor has to say it is willing before anything may join its ipc.
    ipc: shareable
    ports:
      - "${DW_RMF_PORT:-8083}:8080"
      # the galaxea bridge shares this namespace, so its port is published here
      - "${DW_GALAXEA_PORT:-8090}:8090"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
      # a second gz on this host (another sim, another render) must not be
      # discovered as part of this one
      GZ_PARTITION: dreamworld_rmf
      GZ_IP: 127.0.0.1
    restart: unless-stopped

  # The panorama editor and the model behind it. Both are for fixing what a
  # waypoint looks like before its world is generated, so they are idle most of
  # the time — but the model holds ~45GB while loaded, which is why it gets a card
  # of its own rather than sharing with world generation.
  qwen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: pano-editor/qwen-server.Dockerfile
    image: dreamworld/qwen-server:latest
    container_name: dreamworld-qwen
    ports:
      - "${DW_QWEN_PORT:-8088}:8000"
    volumes:
      - ./assets/hf:/assets/hf:ro
    environment:
      HOME: /tmp
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
      # The repo id, resolved out of the mounted cache — not a bare path, so the
      # snapshot hash never has to be written down anywhere.
      QWEN_EDIT_MODEL: Qwen/Qwen-Image-Edit-2509
    # One card, reserved by id — a card world generation is not using
    # (DW_GPU_IDS defaults to 1,2,3,4). No CUDA_VISIBLE_DEVICES beside it: the
    # reservation already exposes exactly that GPU, and it is device 0 inside,
    # so naming 5 there points at nothing and the server starts with no CUDA.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_EDIT_GPU:-5}"]
    restart: unless-stopped

  panoeditor:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: pano-editor/pano-editor.Dockerfile
    image: dreamworld/pano-editor:latest
    container_name: dreamworld-panoeditor
    command:
      - "--base"
      - "/projects/${DW_PROJECT:-multilevel_office}"
      - "--level"
      - "${DW_LEVEL:-L11}"
      - "--port"
      - "8087"
    ports:
      # its own variable: DW_EDITOR_PORT belongs to the traffic editor, and
      # sharing it mapped both editors onto one port the moment it was set
      - "${DW_PANOEDIT_PORT:-8087}:8087"
    volumes:
      - ./assets/projects:/projects        # writable: Save rewrites panos/<id>
    environment:
      HOME: /tmp
      QWEN_URLS: "http://dreamworld-qwen:8000"
    depends_on:
      qwen:
        condition: service_started
    restart: unless-stopped

  # Capture: the one surface for getting a 360 into the building — click the
  # waypoint, drop the photo, drag it into alignment, press generate. Replaces
  # the hand-run flow of naming files, the :8085 aligner, and a terminal
  # `just generate`; jobs go straight to the Prefect queue.
  capture:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: capture/capture.Dockerfile
    image: dreamworld/capture:latest
    container_name: dreamworld-capture
    command:
      - "--base"
      - "/projects/${DW_PROJECT:-multilevel_office}"
      - "--level"
      - "${DW_LEVEL:-L11}"
      - "--port"
      - "8089"
    ports:
      - "${DW_CAPTURE_PORT:-8089}:8089"
    volumes:
      - ./assets/projects:/projects        # writable: uploads and alignment
    environment:
      HOME: /tmp
      PREFECT_API_URL: http://prefect:4200/api
      GPUS: "4"
    depends_on:
      prefect:
        condition: service_started
    restart: unless-stopped

  # The tool surface: one HTTP API that walks the splat viewer and the robot
  # together. Host networking so it can reach the galaxea bridge and so the
  # browser's own localhost:8086 is the same server the viewer talks to.
  interactive:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: interactive/interactive.Dockerfile
    image: dreamworld/interactive:latest
    container_name: dreamworld-interactive
    network_mode: host
    command:
      - "--nav"
      - "/projects/${DW_PROJECT:-multilevel_office}/worlds/${DW_MAP:-multilevel_office}/nav_graphs/0.yaml"
      - "--building"
      - "/projects/${DW_PROJECT:-multilevel_office}/maps/${DW_MAP:-multilevel_office}.building.yaml"
      - "--project"
      - "${DW_PROJECT:-multilevel_office}"
      - "--level"
      - "${DW_LEVEL:-L11}"
      - "--start"
      - "${DW_START:-lift_lobby}"
      - "--viewer"
      - "http://localhost:${DW_VIEWER_PORT:-8081}"
      - "--port"
      - "${DW_INTERACTIVE_PORT:-8086}"
    volumes:
      - ./assets/projects:/projects:ro
    environment:
      # Unset and the viewer walks alone — which is the whole system minus the
      # robot, and the way to run this on a box with no Gazebo.
      GALAXEA_URL: "http://localhost:${DW_GALAXEA_PORT:-8090}"
      # The mission agent's model, over any OpenAI-compatible endpoint. Defaults
      # to the VLM this stack already runs; point DW_VLM_URL at a cliproxyapi and
      # DW_VLM_MODEL at a Claude model to swap it, no rebuild.
      DRIVE_SPEED: "${DW_DRIVE_SPEED:-2.0}"
      TURN_RATE: "${DW_TURN_RATE:-1.25}"
      VLM_BASE_URL: "${DW_VLM_URL:-http://localhost:8000/v1}"
      VLM_API_KEY: "${DW_VLM_KEY:-x}"
      VLM_MODEL: "${DW_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}"
    restart: unless-stopped

  # The Galaxea R1 in its own Gazebo, driven over HTTP. Its own transport
  # partition, so it never discovers the rmfsim gazebo running the same world —
  # two sims on one bus fight over /clock and the door plugins.
  galaxea:
    <<: *as-caller
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-galaxea
    command: ["galaxea", "${DW_PROJECT:-multilevel_office}"]
    # rmfsim's network namespace, so this joins the gazebo you can SEE rather
    # than booting a second one nobody is looking at. gz transport there binds
    # loopback (GZ_IP 127.0.0.1), which is only shared this way — and it means
    # :8090 is published by rmfsim below, not here.
    network_mode: "service:rmfsim"
    # And its IPC namespace, which is the half that is easy to miss. Sharing the
    # network shares localhost, so gz transport on 127.0.0.1 works — but Fast DDS
    # prefers shared memory between participants it believes are on one host, and
    # /dev/shm is per-container. Without this the bridge spawns the robot, drives
    # it, and never receives a single /robot_state: publishing works, discovery
    # does not.
    ipc: "service:rmfsim"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      GZ_PARTITION: dreamworld_rmf
      GZ_IP: 127.0.0.1
      DW_LEVEL: "${DW_LEVEL:-L11}"
      DW_START: "${DW_START:-lift_lobby}"
      # Pacing, shared with the interactive server so the camera and the robot
      # cross a corridor in the same number of seconds.
      DRIVE_SPEED: "${DW_DRIVE_SPEED:-2.0}"
      TURN_RATE: "${DW_TURN_RATE:-1.25}"
    depends_on:
      rmfsim:
        condition: service_started   # only to order the shared image build
    restart: unless-stopped

  editor:
    <<: *as-caller
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-editor
    command: ["editor", "${DW_PROJECT:-multilevel_office}"]
    ports:
      - "${DW_EDITOR_PORT:-8084}:8080"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      # writable: editing a map is the point
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
    depends_on:
      - rmfsim                    # only to order the shared image build
    restart: unless-stopped

  # World generation needs Gazebo rather than CUDA, so it is served from the
  # rmf-tools image while the splat flows are served from the generator. Both
  # register with the same Prefect server, so every operation in this repo is
  # one queue at :4200.
  worldjobs:
    <<: *as-caller
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-worldjobs
    command: ["jobs"]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      # on the compose network, so the server is a service name, not localhost
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_HOME: /tmp/prefect
    depends_on:
      prefect:
        condition: service_healthy
      rmfsim:
        condition: service_started   # only to order the shared image build
    restart: unless-stopped

  generator:
    <<: *as-caller
    build:
      context: ./docker/splat-generator
      dockerfile: splat-generator.Dockerfile
    image: dreamworld/splat-generator:latest
    network_mode: host            # to reach the vlm
    shm_size: 32gb
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/models:/assets/models:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/workspace/projects
    environment:
      HOME: /tmp
      # Every card except 0, which the VLM holds. `just` reads the same
      # variable to size HY-World's rank count, since that shards across every
      # visible GPU and would otherwise broadcast from ranks torchrun never
      # launched.
      CUDA_VISIBLE_DEVICES: "${DW_GPU_IDS:-1,2,3,4}"
      PREFECT_API_URL: http://127.0.0.1:${DW_PREFECT_PORT:-4200}/api
      PREFECT_HOME: /tmp/prefect
    depends_on:
      prefect:
        condition: service_healthy
      # Started, not healthy. generate-world talks to the VLM when a job runs,
      # not when this container boots, and gating on health made the worker
      # wait on a 17 GB model load before it would accept anything at all.
      vlm:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
