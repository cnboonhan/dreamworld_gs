# dreamworld v2 services — grown one at a time as the rebuild reaches them.
# Everything about one building lives under assets/projects/<project>/, and
# every service mounts that one tree. Nothing reaches the network at runtime.

name: dreamworld

x-as-caller: &as-caller
  # run as the invoking user so outputs aren't root-owned; that uid has no
  # entry in the image's passwd, which some libraries insist on reading.
  # USER is that reading: getpass.getuser() consults $USER before it asks
  # pwd, so naming it is what stops the lookup ever reaching a uid that
  # SSSD owns and no passwd file on this box lists. Torch reaches for it to
  # name a compile cache; flashdreams calls default_cache_dir() directly,
  # so pointing TORCHINDUCTOR_CACHE_DIR somewhere writable is not enough.
  # NOTE: a service's own `environment:` REPLACES this block rather than
  # merging into it, which is why both keys are repeated below per service.
  user: "${DW_UID:-1000}:${DW_GID:-1000}"
  environment:
    HOME: /tmp
    USER: "${DW_USER:-dreamworld}"

services:

  # One forwarded port for everything: the proxy owns ${DW_PORT:-8080} and
  # routes each surface under its own path. Services keep no host ports.
  proxy:
    # as the caller, like everything else: the files this serves are the
    # caller's, and a umask-0027 box makes them 0640 — which stock nginx's
    # uid-101 workers cannot open (see proxy.Dockerfile)
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: proxy/proxy.Dockerfile
    image: dreamworld/proxy:latest
    container_name: dreamworld-proxy
    ports:
      - "${DW_PORT:-8080}:80"
    volumes:
      # read-only: the proxy serves the dreamworld files itself, and the
      # baked graph when no editor is running — the minimal launch
      - ./assets/projects:/projects:ro
    environment:
      DW_PROJECT: "${DW_PROJECT:-multilevel_office}"
    restart: unless-stopped

  # The traffic editor — author the building map, over noVNC at /sim_editor.
  # A new building starts here: a floorplan drawing and zero vertices,
  # vertices added one at a time as the places they mark are photographed.
  sim_editor:
    <<: *as-caller
    # rmfsim builds this image; declaring the build here too made `up`
    # build it TWICE, in parallel, racing on the same tag. rmfsim owns it
    # because rmfsim is in both launches and this service is full-tier
    # only — so the tag always exists by the time this starts.
    image: dreamworld/rmf-tools:latest
    depends_on: [rmfsim]
    container_name: dreamworld-sim_editor
    command: ["editor", "${DW_PROJECT:-multilevel_office}"]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      # writable: editing the map is the point
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      DISPLAY: ":99"
    restart: unless-stopped

  # The building under simulation: Gazebo + RMF over noVNC at /rmfsim.
  # RMF owns the INFRASTRUCTURE — doors and lifts, their states and
  # requests; the robot's walkthrough lives in the dreamworld viewer. The
  # world regenerates from building.yaml on boot if missing (just world
  # rebuilds it deliberately after map edits).
  rmfsim:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: rmf-tools/rmf-tools.Dockerfile
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-rmfsim
    command: ["sim", "${DW_PROJECT:-multilevel_office}"]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      DISPLAY: ":99"
      # sim wall-clock speed: doors open and lifts ride this many times
      # faster than real time
      DW_SIM_RTF: "${DW_SIM_RTF:-3}"
    restart: unless-stopped

  # The dreamworld editor — the panorama -> splat -> align -> walkthrough flow
  # will live here, at /dreamworld_editor. Minimal first: a live minimap of
  # the levels that reflects the map as it is traced next door in /sim_editor.
  dreamworld_editor:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: dreamworld_editor/dreamworld_editor.Dockerfile
    image: dreamworld/dreamworld_editor:latest
    container_name: dreamworld-editor
    volumes:
      # writable: this UI is the single writer of the dreamworld/ tree —
      # vertices, uploaded panoramas, alignment. building.yaml stays the
      # traffic editor's file and is only ever read here.
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      DW_PROJECT: "${DW_PROJECT:-multilevel_office}"
      QWEN_URL: "http://qwen:8000"
      SPLATGEN_URL: "http://splatgen:8000"
      WANGEN_URLS: "http://wangen:8000,http://wangen2:8000"
      STREAMER_URL: "http://streamer:8000"
    restart: unless-stopped

  # Wan 2.2 — edge-crossing videos from first+last frames: door openings,
  # lift rides, the seconds reality hides from both panoramas. ~70GB VRAM
  # once loaded, a card of its own, one job at a time with a queue.
  wangen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: wangen/wangen.Dockerfile
    image: dreamworld/wangen:latest
    container_name: dreamworld-wangen
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_WAN_GPU:-6}"]
    restart: unless-stopped

  # A second pair of hands on the same video queue-shape: the editor's
  # client spreads crossings across every instance it is given, so the
  # backlog drains twice as fast. Same image, the spare card.
  wangen2:
    <<: *as-caller
    # the same image wangen builds — one builder, or `up` builds it twice
    image: dreamworld/wangen:latest
    depends_on: [wangen]
    container_name: dreamworld-wangen2
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_WAN2_GPU:-7}"]
    restart: unless-stopped

  # The viewer's live layer: a streaming image-to-video model. Seed it
  # with the panorama crop the walker is looking at plus a prompt, and it
  # streams that view alive until the camera turns and re-seeds it.
  # 1.3B, so one card carries it with room to spare.
  streamer:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: streamer/streamer.Dockerfile
    image: dreamworld/streamer:latest
    container_name: dreamworld-streamer
    shm_size: 32gb
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/hf:/assets/hf:ro
      # Triton and Inductor compile kernels on the first generate() —
      # about 75 seconds, and the same 260MB every time the container was
      # recreated. Kept on the host, a recreate reuses them. The cache is
      # keyed by torch version and GPU arch, so a stale entry misses
      # rather than misleads: it is always safe to delete.
      - ./assets/cache/streamer:/cache
    environment:
      HOME: /tmp
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
      DW_STREAMER_RUNNER: "${DW_STREAMER_RUNNER:-causal-forcing-wan2.1-i2v-1.3b-framewise}"
      DW_STREAMER_WIDTH: "${DW_STREAMER_WIDTH:-832}"
      DW_STREAMER_HEIGHT: "${DW_STREAMER_HEIGHT:-480}"
      # rebuild the rollout from its seed once the view has slid this far
      DW_STREAMER_DRIFT_PX: "${DW_STREAMER_DRIFT_PX:-48}"
      # a cap, not the usual bound: 30s runs about 130 frames, so the
      # seconds below are what actually ends a loop
      DW_STREAMER_REANCHOR: "${DW_STREAMER_REANCHOR:-960}"
      # ...or this many seconds, whichever comes first: the loop you
      # watch is this long
      DW_STREAMER_LOOP_S: "${DW_STREAMER_LOOP_S:-30}"
      # and the last of it fades back to the photograph, so the loop
      # closes instead of cutting. 0 restores the cut.
      DW_STREAMER_TAIL_S: "${DW_STREAMER_TAIL_S:-5}"
      # torch's inductor cache-dir check calls getpass.getuser(), which
      # falls back to pwd.getpwuid() -- and this caller is an LDAP uid, so
      # the /etc/passwd mounted above (local users only) has no entry for
      # it. getuser() prefers $USER, so it never reaches pwd.
      USER: "${DW_USER:-dreamworld}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_STREAMER_GPU:-1}"]
    restart: unless-stopped

  # The state holder — the seam between the walk and the building. The
  # viewer pushes where it stands; the harness (and anyone else) asks.
  dreamworld_core:
    build:
      context: ./docker
      dockerfile: dreamworld_core/dreamworld_core.Dockerfile
    image: dreamworld/dreamworld_core:latest
    container_name: dreamworld-core
    restart: unless-stopped

  # The walkthrough — main's splat viewer rebuilt on the dreamworld tree,
  # at /dreamworld_viewer. Static nginx: the graph and every asset come
  # through the editor's routes.
  dreamworld_viewer:
    build:
      context: ./docker
      dockerfile: dreamworld_viewer/dreamworld_viewer.Dockerfile
    image: dreamworld/dreamworld_viewer:latest
    container_name: dreamworld-viewer
    restart: unless-stopped

  # The harness — main's interactive dashboard and mission agent on the v2
  # seams: movement through dreamworld_core, doors and lifts through the
  # infra bridge in the sim, the agent against the vLLM. At /harness.
  harness:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: harness/harness.Dockerfile
    image: dreamworld/harness:latest
    container_name: dreamworld-harness
    command:
      - "--nav"
      - "/projects/${DW_PROJECT:-multilevel_office}/worlds/${DW_MAP:-multilevel_office}/nav_graphs/0.yaml"
      - "--building"
      - "/projects/${DW_PROJECT:-multilevel_office}/maps/${DW_MAP:-multilevel_office}.building.yaml"
      - "--project"
      - "${DW_PROJECT:-multilevel_office}"
      - "--level"
      - "${DW_LEVEL:-L11}"
      - "--start"
      - "${DW_START:-L11.v0.apex_lab}"
      - "--port"
      - "8086"
    volumes:
      - ./assets/projects:/projects:ro
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      CORE_URL: "http://dreamworld_core:8000"
      # through the PROXY, which answers even with no editor running
      EDITOR_URL: "http://proxy/dreamworld_editor"
      BRIDGE_URL: "http://rmfsim:8090"
      VLM_BASE_URL: "http://vlm:8000/v1"
    restart: unless-stopped

  # Qwen3-VL — the trajectory planner's eyes during splat generation (and
  # later the mission agent's). ~17GB loaded, a card of its own.
  vlm:
    build:
      context: ./docker
      dockerfile: vlm/vlm.Dockerfile
    image: dreamworld/vlm:latest
    container_name: dreamworld-vlm
    ipc: host
    volumes:
      - ./assets/hf:/hf:ro
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      # --trust-remote-code makes transformers mkdir $HF_HOME/modules, and
      # /hf is mounted read-only on purpose: weights are never mutated.
      HF_MODULES_CACHE: /tmp/hf_modules
      # FlashInfer ships PRECOMPILED cubins and this build has none for
      # sm_103, so its sampler dies with "no kernel image is available for
      # execution on the device" during the profile run. The newer ptxas
      # next door cannot help — nothing is being assembled here, the kernel
      # simply was not built for this card. Fall back to the torch-native
      # top-k/top-p sampler, which is compiled for it.
      VLLM_USE_FLASHINFER_SAMPLER: "0"

    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --port=8000
      - --host=0.0.0.0
      # a mission's transcript grows with every tool result; 32k died
      # mid-lift-ride. Qwen3-VL carries 128k natively, and the H200 has
      # the KV room to spare.
      - --max-model-len=131072
      - --trust-remote-code
      - --gpu-memory-utilization=0.80
      # tool calling, for the mission agent to come; harmless to the planner
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_VLM_GPU:-0}"]
    restart: unless-stopped

  # HY-World 2.0 — panorama -> 3DGS world. Main's generator image with a
  # one-job HTTP wrapper in place of Prefect; four cards, ~17 minutes a
  # world. The editor submits scenes under the dreamworld/ tree.
  splatgen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: splatgen/splatgen.Dockerfile
    image: dreamworld/splatgen:latest
    container_name: dreamworld-splatgen
    shm_size: 32gb
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/models:/assets/models:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      # as everywhere else that runs as the caller: an LDAP uid has no
      # /etc/passwd line, and torch asks getpass.getuser() for one
      USER: "${DW_USER:-dreamworld}"
      # One worker per card — and the COUNT MUST DIVIDE 16. Stage 3
      # (world expansion) shards attention across the cards and its head
      # size is 16, so three cards dies ten minutes in with "Invalid Head
      # size: 16, which should be divisible by spsize 3". 1, 2 or 4,
      # never 3. The streamer holds card 1, which leaves two.
      DW_GEN_NPROC: "${DW_GEN_NPROC:-2}"
      DW_LLM_ADDR: vlm
    depends_on:
      # started, not healthy: the planner talks to the VLM when a job runs,
      # not when this container boots
      vlm:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              # Card 1 was this service's before the live streamer
              # moved in; generating a world and streaming one are the
              # two jobs most likely to be wanted at once, so they do not
              # share. Spelled out, not "${VAR:-2,3}": device_ids is a
              # LIST, and an interpolated string lands in it as ONE id
              # named "2,3", which is not a device.
              #
              # Two on this eight-card box (the count must divide 16,
              # see DW_GEN_NPROC above). A smaller box overrides BOTH in
              # its overlay compose file — see compose.gb300.yaml.
              device_ids: ["2", "3"]
    restart: unless-stopped

  # Qwen-Image-Edit-2509 — the model behind panorama variants. Holds ~45GB
  # VRAM while loaded, so it gets a card of its own, one world generation
  # will not be using. No host port: only the editor talks to it.
  qwen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: qwen/qwen.Dockerfile
    image: dreamworld/qwen-server:latest
    container_name: dreamworld-qwen
    volumes:
      - ./assets/hf:/assets/hf:ro
    environment:
      HOME: /tmp
      USER: "${DW_USER:-dreamworld}"
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
      # the repo id, resolved out of the mounted cache — not a bare path,
      # so the snapshot hash never has to be written down anywhere
      QWEN_EDIT_MODEL: Qwen/Qwen-Image-Edit-2509
    # one card, reserved by id; it is device 0 inside the container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_EDIT_GPU:-5}"]
    restart: unless-stopped
