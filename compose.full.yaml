# dreamworld v2 services — grown one at a time as the rebuild reaches them.
# Everything about one building lives under assets/projects/<project>/, and
# every service mounts that one tree. Nothing reaches the network at runtime.

name: dreamworld

x-as-caller: &as-caller
  # run as the invoking user so outputs aren't root-owned; that uid has no
  # entry in the image's passwd, which some libraries insist on reading
  user: "${DW_UID:-1000}:${DW_GID:-1000}"
  environment:
    HOME: /tmp

services:

  # One forwarded port for everything: the proxy owns ${DW_PORT:-8080} and
  # routes each surface under its own path. Services keep no host ports.
  proxy:
    build:
      context: ./docker
      dockerfile: proxy/proxy.Dockerfile
    image: dreamworld/proxy:latest
    container_name: dreamworld-proxy
    ports:
      - "${DW_PORT:-8080}:80"
    restart: unless-stopped

  # The traffic editor — author the building map, over noVNC at /sim_editor.
  # A new building starts here: a floorplan drawing and zero vertices,
  # vertices added one at a time as the places they mark are photographed.
  sim_editor:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: rmf-tools/rmf-tools.Dockerfile
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-sim_editor
    command: ["editor", "${DW_PROJECT:-multilevel_office}"]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      # writable: editing the map is the point
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
    restart: unless-stopped

  # The building under simulation: Gazebo + RMF over noVNC at /rmfsim.
  # RMF owns the INFRASTRUCTURE — doors and lifts, their states and
  # requests; the robot's walkthrough lives in the dreamworld viewer. The
  # world regenerates from building.yaml on boot if missing (just world
  # rebuilds it deliberately after map edits).
  rmfsim:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: rmf-tools/rmf-tools.Dockerfile
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-rmfsim
    command: ["sim", "${DW_PROJECT:-multilevel_office}"]
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
    restart: unless-stopped

  # The dreamworld editor — the panorama -> splat -> align -> walkthrough flow
  # will live here, at /dreamworld_editor. Minimal first: a live minimap of
  # the levels that reflects the map as it is traced next door in /sim_editor.
  dreamworld_editor:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: dreamworld_editor/dreamworld_editor.Dockerfile
    image: dreamworld/dreamworld_editor:latest
    container_name: dreamworld-editor
    volumes:
      # writable: this UI is the single writer of the dreamworld/ tree —
      # vertices, uploaded panoramas, alignment. building.yaml stays the
      # traffic editor's file and is only ever read here.
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DW_PROJECT: "${DW_PROJECT:-multilevel_office}"
      QWEN_URL: "http://qwen:8000"
      SPLATGEN_URL: "http://splatgen:8000"
      WANGEN_URLS: "http://wangen:8000,http://wangen2:8000"
    restart: unless-stopped

  # Wan 2.2 — edge-crossing videos from first+last frames: door openings,
  # lift rides, the seconds reality hides from both panoramas. ~70GB VRAM
  # once loaded, a card of its own, one job at a time with a queue.
  wangen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: wangen/wangen.Dockerfile
    image: dreamworld/wangen:latest
    container_name: dreamworld-wangen
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_WAN_GPU:-6}"]
    restart: unless-stopped

  # A second pair of hands on the same video queue-shape: the editor's
  # client spreads crossings across every instance it is given, so the
  # backlog drains twice as fast. Same image, the spare card.
  wangen2:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: wangen/wangen.Dockerfile
    image: dreamworld/wangen:latest
    container_name: dreamworld-wangen2
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_WAN2_GPU:-7}"]
    restart: unless-stopped

  # The state holder — the seam between the walk and the building. The
  # viewer pushes where it stands; the harness (and anyone else) asks.
  dreamworld_core:
    build:
      context: ./docker
      dockerfile: dreamworld_core/dreamworld_core.Dockerfile
    image: dreamworld/dreamworld_core:latest
    container_name: dreamworld-core
    restart: unless-stopped

  # The walkthrough — main's splat viewer rebuilt on the dreamworld tree,
  # at /dreamworld_viewer. Static nginx: the graph and every asset come
  # through the editor's routes.
  dreamworld_viewer:
    build:
      context: ./docker
      dockerfile: dreamworld_viewer/dreamworld_viewer.Dockerfile
    image: dreamworld/dreamworld_viewer:latest
    container_name: dreamworld-viewer
    restart: unless-stopped

  # The harness — main's interactive dashboard and mission agent on the v2
  # seams: movement through dreamworld_core, doors and lifts through the
  # infra bridge in the sim, the agent against the vLLM. At /harness.
  harness:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: harness/harness.Dockerfile
    image: dreamworld/harness:latest
    container_name: dreamworld-harness
    command:
      - "--nav"
      - "/projects/${DW_PROJECT:-multilevel_office}/worlds/${DW_MAP:-multilevel_office}/nav_graphs/0.yaml"
      - "--building"
      - "/projects/${DW_PROJECT:-multilevel_office}/maps/${DW_MAP:-multilevel_office}.building.yaml"
      - "--project"
      - "${DW_PROJECT:-multilevel_office}"
      - "--level"
      - "${DW_LEVEL:-L11}"
      - "--start"
      - "${DW_START:-L11.v0.apex_lab}"
      - "--port"
      - "8086"
    volumes:
      - ./assets/projects:/projects:ro
    environment:
      HOME: /tmp
      CORE_URL: "http://dreamworld_core:8000"
      EDITOR_URL: "http://dreamworld_editor:8080/dreamworld_editor"
      BRIDGE_URL: "http://rmfsim:8090"
      VLM_BASE_URL: "http://vlm:8000/v1"
    restart: unless-stopped

  # Qwen3-VL — the trajectory planner's eyes during splat generation (and
  # later the mission agent's). ~17GB loaded, a card of its own.
  vlm:
    image: vllm/vllm-openai:v0.11.0
    container_name: dreamworld-vlm
    ipc: host
    volumes:
      - ./assets/hf:/hf:ro
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --port=8000
      - --host=0.0.0.0
      # a mission's transcript grows with every tool result; 32k died
      # mid-lift-ride. Qwen3-VL carries 128k natively, and the H200 has
      # the KV room to spare.
      - --max-model-len=131072
      - --trust-remote-code
      - --gpu-memory-utilization=0.80
      # tool calling, for the mission agent to come; harmless to the planner
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_VLM_GPU:-0}"]
    restart: unless-stopped

  # HY-World 2.0 — panorama -> 3DGS world. Main's generator image with a
  # one-job HTTP wrapper in place of Prefect; four cards, ~17 minutes a
  # world. The editor submits scenes under the dreamworld/ tree.
  splatgen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: splatgen/splatgen.Dockerfile
    image: dreamworld/splatgen:latest
    container_name: dreamworld-splatgen
    shm_size: 32gb
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/models:/assets/models:ro
      - ./assets/hf:/assets/hf:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DW_GEN_NPROC: "4"
      DW_LLM_ADDR: vlm
    depends_on:
      # started, not healthy: the planner talks to the VLM when a job runs,
      # not when this container boots
      vlm:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              # the cards the VLM and qwen are NOT holding
              device_ids: ["1", "2", "3", "4"]
    restart: unless-stopped

  # Qwen-Image-Edit-2509 — the model behind panorama variants. Holds ~45GB
  # VRAM while loaded, so it gets a card of its own, one world generation
  # will not be using. No host port: only the editor talks to it.
  qwen:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: qwen/qwen.Dockerfile
    image: dreamworld/qwen-server:latest
    container_name: dreamworld-qwen
    volumes:
      - ./assets/hf:/assets/hf:ro
    environment:
      HOME: /tmp
      HF_HOME: /assets/hf
      HF_HUB_OFFLINE: "1"
      # the repo id, resolved out of the mounted cache — not a bare path,
      # so the snapshot hash never has to be written down anywhere
      QWEN_EDIT_MODEL: Qwen/Qwen-Image-Edit-2509
    # one card, reserved by id; it is device 0 inside the container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ["${DW_EDIT_GPU:-5}"]
    restart: unless-stopped
