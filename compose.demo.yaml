# DEMO: the walkthrough alone, browser-only. The bundle is a
# self-contained static site (just bundle), so this is one stock nginx
# and nothing else — no backend, no GPU, no build.
#
#   just bundle         build assets/projects/<project>/bundle
#   just demo           serve it at ${DW_DEMO_PORT:-8080}
name: dreamworld-demo

services:
  demo:
    image: nginx:alpine
    container_name: dreamworld-demo
    ports:
      - "${DW_DEMO_PORT:-8080}:80"
    volumes:
      - ./assets/projects/${DW_PROJECT:-multilevel_office}/bundle:/bundle:ro
      - ./docker/dreamworld_viewer/demo.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
