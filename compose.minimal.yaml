# MINIMAL: walk + simulate + command an already-generated dreamworld.
# No GPU and no local models: the mission agent speaks to an
# OpenAI-compatible VLM you already run — a cliproxyapi, a remote vLLM —
# reached at DW_VLM_URL (default: the HOST's :8000). Set in .env:
#   DW_VLM_URL=http://host.docker.internal:8000/v1
#   DW_VLM_MODEL=<model name the endpoint serves>
#   DW_VLM_KEY=<api key, if the endpoint wants one>
# Every service definition lives in compose.full.yaml — this file only
# picks. No editor here: the proxy serves the dreamworld files itself,
# and the graph the editor BAKED on its last change — author in the
# full stack at least once first.
#
#   just minimal        (or: docker compose -f compose.minimal.yaml up -d)
#
# The same project name as the full stack, so the two reconcile: launching
# minimal on a box that ran full leaves the extra containers alone.
name: dreamworld

services:
  proxy:
    extends: {file: compose.full.yaml, service: proxy}
  rmfsim:
    extends: {file: compose.full.yaml, service: rmfsim}
  dreamworld_core:
    extends: {file: compose.full.yaml, service: dreamworld_core}
  dreamworld_viewer:
    extends: {file: compose.full.yaml, service: dreamworld_viewer}
  harness:
    extends: {file: compose.full.yaml, service: harness}
    # host-gateway: the VLM lives on the HOST here, not in the stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VLM_BASE_URL: "${DW_VLM_URL:-http://host.docker.internal:8000/v1}"
      VLM_MODEL: "${DW_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}"
      VLM_API_KEY: "${DW_VLM_KEY:-x}"
