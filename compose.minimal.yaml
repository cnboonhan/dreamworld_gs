# The runtime, and nothing else — for a device that receives a project whose
# splats are already generated (`just bundle` on the box that built them,
# `just unbundle` here). Four services, none needing a GPU:
#
#   viewer       the splat worlds, walkable            :8081
#   rmfsim       the building under RMF in Gazebo      :8083 (+ :8090 bridge)
#   galaxea      the robot in that sim, driven by HTTP
#   interactive  the harness: tools, dashboard, agent  :8086
#
# What is deliberately absent: Prefect and both job workers (nothing is
# generated here), the panorama editor and its model (editing happens where
# the GPUs are), the pano viewer (nice, not needed), and the VLM (no GPU
# assumed). The mission agent still works — point DW_VLM_URL at any
# OpenAI-compatible endpoint; a device with a GPU that wants the model
# locally runs the full compose.yaml instead.
#
# Offline target: build the three images where there is network and carry
# them over —
#
#   docker save dreamworld/splat-viewer dreamworld/interactive \
#               dreamworld/rmf-tools | gzip > dreamworld-runtime.tgz
#   # on the target:
#   docker load < dreamworld-runtime.tgz
#   printf 'DW_PROJECT=<project>\nDW_UID=%s\nDW_GID=%s\n' "$(id -u)" "$(id -g)" > .env
#   docker compose -f compose.minimal.yaml up -d
#
# Same service and container names as compose.yaml, so the two files must not
# run side by side — on the build box, stop the full stack first.

name: dreamworld

x-as-caller: &as-caller
  user: "${DW_UID:-1000}:${DW_GID:-1000}"
  volumes:
    - /etc/passwd:/etc/passwd:ro
  environment:
    HOME: /tmp

services:

  viewer:
    build:
      context: ./docker/splat-viewer
      dockerfile: splat-viewer.Dockerfile
    image: dreamworld/splat-viewer:latest
    container_name: dreamworld-viewer
    ports:
      - "${DW_VIEWER_PORT:-8081}:80"
    volumes:
      - ./assets/projects:/usr/share/nginx/html/files:ro
    restart: unless-stopped

  rmfsim:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: rmf-tools/rmf-tools.Dockerfile
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-rmfsim
    command: ["sim", "${DW_PROJECT:-multilevel_office}"]
    ipc: shareable
    ports:
      - "${DW_RMF_PORT:-8083}:8080"
      - "${DW_GALAXEA_PORT:-8090}:8090"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      DISPLAY: ":99"
      GZ_PARTITION: dreamworld_rmf
      GZ_IP: 127.0.0.1
    restart: unless-stopped

  galaxea:
    <<: *as-caller
    image: dreamworld/rmf-tools:latest
    container_name: dreamworld-galaxea
    command: ["galaxea", "${DW_PROJECT:-multilevel_office}"]
    # rmfsim's network AND ipc namespaces — the robot joins the gazebo you can
    # see, and Fast DDS needs the shared /dev/shm to deliver /robot_state.
    # compose.yaml says why at length.
    network_mode: "service:rmfsim"
    ipc: "service:rmfsim"
    volumes:
      - /etc/passwd:/etc/passwd:ro
      - ./assets/projects:/projects
    environment:
      HOME: /tmp
      GZ_PARTITION: dreamworld_rmf
      GZ_IP: 127.0.0.1
      DW_LEVEL: "${DW_LEVEL:-L11}"
      DW_START: "${DW_START:-lift_lobby}"
      DRIVE_SPEED: "${DW_DRIVE_SPEED:-2.0}"
      TURN_RATE: "${DW_TURN_RATE:-1.25}"
    depends_on:
      rmfsim:
        condition: service_started
    restart: unless-stopped

  interactive:
    <<: *as-caller
    build:
      context: ./docker
      dockerfile: interactive/interactive.Dockerfile
    image: dreamworld/interactive:latest
    container_name: dreamworld-interactive
    network_mode: host
    command:
      - "--nav"
      - "/projects/${DW_PROJECT:-multilevel_office}/worlds/${DW_MAP:-multilevel_office}/nav_graphs/0.yaml"
      - "--building"
      - "/projects/${DW_PROJECT:-multilevel_office}/maps/${DW_MAP:-multilevel_office}.building.yaml"
      - "--project"
      - "${DW_PROJECT:-multilevel_office}"
      - "--level"
      - "${DW_LEVEL:-L11}"
      - "--start"
      - "${DW_START:-lift_lobby}"
      - "--viewer"
      - "http://localhost:${DW_VIEWER_PORT:-8081}"
      - "--port"
      - "${DW_INTERACTIVE_PORT:-8086}"
    volumes:
      - ./assets/projects:/projects:ro
    environment:
      GALAXEA_URL: "http://localhost:${DW_GALAXEA_PORT:-8090}"
      DRIVE_SPEED: "${DW_DRIVE_SPEED:-2.0}"
      TURN_RATE: "${DW_TURN_RATE:-1.25}"
      # The mission agent's model — an endpoint, not a service here. Point it
      # wherever an OpenAI-compatible server answers; without one, every tool
      # stays directly callable and only missions are off.
      VLM_BASE_URL: "${DW_VLM_URL:-http://localhost:8000/v1}"
      VLM_API_KEY: "${DW_VLM_KEY:-x}"
      VLM_MODEL: "${DW_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct}"
    restart: unless-stopped
