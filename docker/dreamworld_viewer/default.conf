# The page itself must revalidate on every load: the scripts ride ?v=
# version queries, but a browser-cached index.html pins the OLD versions
# forever — which is how a tab kept running last week's viewer while the
# core moved on without it. Assets stay cacheable; the entrypoint does not.
server {
    listen 80;
    root /usr/share/nginx/html;

    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
