<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dreamworld live</title>
<style>
  :root { color-scheme: dark }
  html, body { margin: 0; height: 100%; background: #0a0d12; color: #dfe6ef;
               font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
               overflow: hidden }
  #stage { position: absolute; inset: 0 }
  /* the panorama and the rollout occupy the same rectangle: panning shows
     the photograph, standing still shows it alive */
  #pano, #live { position: absolute; inset: 0; width: 100%; height: 100%;
                 display: block; object-fit: cover }
  #live { opacity: 0; transition: opacity .35s; background: #000;
          pointer-events: none }
  #live.on { opacity: 1 }
  #bar { position: absolute; top: 0; left: 0; right: 0; display: flex;
         gap: 10px; align-items: center; padding: 8px 14px; z-index: 10;
         background: rgba(11,14,19,.85); border-bottom: 1px solid #232c38 }
  #bar b { color: #4ea1ff }
  .k { color: #8b98a8 }
  select, input, button {
    background: #1e2530; color: #dfe6ef; border: 1px solid #2f3a48;
    border-radius: 6px; padding: 4px 8px; font: inherit }
  button { cursor: pointer }
  #chip { font-size: 12px; border: 1px solid #2f3a48; border-radius: 10px;
          padding: 2px 8px; color: #8b98a8; margin-left: auto }
  #core { font-size: 12px; border: 1px solid #2f3a48; border-radius: 10px;
          padding: 2px 8px; color: #8b98a8; cursor: pointer;
          user-select: none }
  #core.on { color: #56d364; border-color: #238636 }
  #core.off { color: #f85149; border-color: #da3633 }
  #chip.on { color: #56d364; border-color: #238636 }
  #chip.wait { color: #e3b341; border-color: #9e6a03 }
  #chip.off { color: #f85149; border-color: #da3633 }
  #promptbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
               display: flex; gap: 8px; align-items: center; padding: 10px 14px;
               background: rgba(11,14,19,.85); border-top: 1px solid #232c38 }
  #prompt { flex: 1 }
  #hint { position: absolute; left: 14px; bottom: 56px; color: #8b98a8;
          z-index: 5; text-shadow: 0 1px 3px #000 }
  #vid { position: absolute; inset: 0; width: 100%; height: 100%;
         object-fit: cover; z-index: 8; opacity: 0; transition: opacity .25s;
         pointer-events: none; background: #000 }
  #shade { position: absolute; inset: 0; background: #000; z-index: 7;
           opacity: 0; transition: opacity .3s; pointer-events: none }
  #planbox { position: absolute; top: 52px; right: 28px; width: 320px;
             height: 220px; overflow: hidden; background: rgba(10,13,18,.92);
             border: 1px solid #232c38; border-radius: 8px; z-index: 10 }
  #plan { display: block; width: 100%; height: 100%; cursor: pointer }
  #plangrip { position: absolute; left: 0; bottom: 0; width: 18px;
              height: 18px; cursor: sw-resize; z-index: 11 }
  #plangrip::after { content: ''; position: absolute; left: 3px; bottom: 3px;
                     border-left: 9px solid #4ea1ff;
                     border-top: 9px solid transparent; opacity: .5 }
  #plangrip:hover::after { opacity: 1 }
  #planBtn { position: absolute; top: 56px; right: 32px; z-index: 11;
             background: #1e2530; color: #dfe6ef; border: 1px solid #2f3a48;
             border-radius: 6px; width: 26px; height: 24px; cursor: pointer }
  #panel { position: absolute; top: 282px; right: 28px; width: 320px;
           background: rgba(17,21,28,.95); border: 1px solid #232c38;
           border-radius: 8px; padding: 10px; z-index: 10; display: none }
  #panel button.go, #apply { background: #2c6e3f;
                             border-color: #3a8a52 }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="pano"></canvas>
    <img id="live" alt="">
    <video id="vid" muted playsinline></video>
    <div id="shade"></div>
  </div>
  <button id="planBtn" title="hide the plan">−</button>
  <div id="planbox">
    <canvas id="plan" width="320" height="220"></canvas>
    <div id="plangrip" title="drag to resize the plan"></div>
  </div>
  <div id="panel">
    <div style="margin-bottom:8px">walk to <b id="tgt"></b></div>
    <div style="display:flex; gap:6px; align-items:center">
      <span class="k">arrive as</span>
      <select id="tlook"></select>
      <button class="go" id="goBtn">go</button>
      <button id="cancelBtn">×</button>
    </div>
    <div class="k" id="tnote" style="margin-top:6px"></div>
  </div>
  <div id="bar">
    <b>dreamworld live</b>
    <span class="k">at</span> <b id="where">…</b>
    <span class="k" id="note"></span>
    <a href="walk.html" class="k" title="the splat walkthrough">walk ↗</a>
    <span id="chip">streamer …</span>
    <span id="core"
          title="the core is the one writer of position and this viewer
follows it — click to walk free, click again to catch up">core …</span>
  </div>
  <div id="hint">A/D or ←/→ turn · W/S or ↑/↓ tilt · Q/E zoom ·
    hold still and the view comes alive</div>
  <div id="promptbar">
    <span class="k">prompt</span>
    <input id="prompt" placeholder="what should happen in this view">
    <button id="apply" class="go">apply</button>
  </div>
  <script src="pano.js"></script>
  <script src="live.js?v=14"></script>
</body>
</html>
