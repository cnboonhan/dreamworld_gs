# The browser-only demo: the viewer's static files plus the bundle,
# wearing the SAME paths the full stack serves them at — viewer.js never
# knows the difference. No core here: its paths 404 fast, and the viewer
# walks free from the first click.
server {
    listen 80;

    location = / {
        return 302 /dreamworld_viewer/;
    }
    location /dreamworld_viewer/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache";
    }
    location = /dreamworld_editor/graph {
        alias /bundle/graph.json;
        default_type application/json;
    }
    location /dreamworld_editor/files/ {
        alias /bundle/files/;
    }
    location /dreamworld_core/ {
        return 404;
    }
}
