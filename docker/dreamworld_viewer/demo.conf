# The browser-only demo: the bundle IS a self-contained static site
# (just bundle folds the viewer in with relative paths), so this nginx
# only serves files. Any other static host — GitHub Pages included —
# serves the same directory just as well.
server {
    listen 80;
    root /bundle;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
