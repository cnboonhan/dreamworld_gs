server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    sendfile on;
    tcp_nopush on;

    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # mounted panoramas; the JSON listing populates the viewer's file picker
    location /files/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
}
