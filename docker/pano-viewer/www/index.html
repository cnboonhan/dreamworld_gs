<!doctype html>
<meta charset="utf-8">
<title>panorama viewer</title>
<!--
  Equirectangular 360 viewer for the panoramas in assets/panos.

  The WebGL engine (ray-per-fragment equirect sampling, no geometry) is ported
  from the dream_editor viewer in the htx-robotics-release dreamworld project.
  Reduced to a single panel and given a file picker, since here it is used to
  inspect generation inputs rather than compare restyle candidates.
-->
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;
       background:#12161c;color:#dfe6ef;
       font:13px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:10px 14px;
         border-bottom:1px solid #232c38;background:#161b23}
  select,button{background:#1e2530;color:#dfe6ef;border:1px solid #2f3a48;
                border-radius:6px;padding:6px 10px;font:inherit}
  button{cursor:pointer}
  button:hover{background:#273040}
  #meta{margin-left:auto;color:#8b98a8;font-variant-numeric:tabular-nums}
  #meta .warn{color:#f0a35e}
  #stage{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
         cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  #hint{position:absolute;left:14px;bottom:12px;color:#7d8a9a;
        text-shadow:0 1px 3px #000;pointer-events:none}
</style>

<header>
  <select id="pick"></select>
  <button id="reset">reset view</button>
  <span id="meta"></span>
</header>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hint">drag to look · scroll to zoom · double-click to reset</div>

<script>
const $ = id => document.getElementById(id);
let yaw = 0, pitch = 0, fov = 2.2, ready = false;

const VS = `attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}`;
const FS = `precision highp float;uniform sampler2D tex;
uniform vec2 res;uniform float yaw,pitch,fov;
const float PI=3.14159265358979;
void main(){
 vec3 F=vec3(cos(pitch)*cos(yaw),cos(pitch)*sin(yaw),sin(pitch));
 vec3 R=normalize(cross(F,vec3(0.0,0.0,1.0)));vec3 U=cross(R,F);
 float t=tan(fov*0.5);vec2 c=(gl_FragCoord.xy-0.5*res)/(0.5*res.x);
 vec3 d=normalize(F+c.x*t*R+c.y*t*U);
 float lon=atan(d.y,d.x),lat=asin(clamp(d.z,-1.0,1.0));
 gl_FragColor=texture2D(tex,vec2(lon/(2.0*PI)+0.5,0.5-lat/PI));}`;

const cvs = $("cv");
const gl = cvs.getContext("webgl", {antialias:true});
const sh = (t,s) => {const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;};
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const pl = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(pl);
gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);

const U = {yaw:"yaw", pitch:"pitch", fov:"fov", res:"res", tex:"tex"};
for (const k in U) U[k] = gl.getUniformLocation(prog, U[k]);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,
              new Uint8Array([18,22,28,255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// captures run to 7680x3840; resample to a size every GPU accepts as a texture
const MAXW = 4096;
function upload(img){
  const c = document.createElement("canvas");
  c.width = MAXW; c.height = MAXW / 2;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
}

function draw(){
  if (!ready) return;
  gl.uniform1i(U.tex, 0);
  gl.uniform1f(U.yaw, yaw); gl.uniform1f(U.pitch, pitch); gl.uniform1f(U.fov, fov);
  gl.uniform2f(U.res, cvs.width, cvs.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function resize(){
  const r = devicePixelRatio || 1;
  cvs.width = Math.max(1, cvs.clientWidth * r);
  cvs.height = Math.max(1, cvs.clientHeight * r);
  gl.viewport(0, 0, cvs.width, cvs.height);
  draw();
}
function reset(){ yaw = 0; pitch = 0; fov = 2.2; draw(); }

function load(name){
  ready = false;
  $("meta").textContent = "loading…";
  const img = new Image();
  img.onload = () => {
    upload(img); ready = true;
    const ratio = img.naturalWidth / img.naturalHeight;
    // the generator needs 2:1; flag anything else before a 12-minute run
    const bad = Math.abs(ratio - 2) > 0.01;
    $("meta").innerHTML = `${img.naturalWidth}x${img.naturalHeight} · ratio ` +
      (bad ? `<span class="warn">${ratio.toFixed(3)} (not 2:1 — generation expects equirectangular)</span>`
           : ratio.toFixed(3));
    reset();
  };
  img.onerror = () => { $("meta").textContent = "failed to load"; };
  // `name` is a path now, so encode the segments but keep the slashes
  img.src = "files/" + name.split("/").map(encodeURIComponent).join("/");
}

let drag = false;
cvs.addEventListener("pointerdown", () => drag = true);
addEventListener("pointerup", () => drag = false);
addEventListener("pointermove", e => {
  if (!drag) return;
  const s = fov / innerHeight * (devicePixelRatio || 1) * 1.2;
  yaw += (e.movementX || 0) * s;
  pitch += (e.movementY || 0) * s;
  const lim = 85 * Math.PI / 180;
  pitch = Math.max(-lim, Math.min(lim, pitch));
  draw();
});
cvs.addEventListener("wheel", e => {
  e.preventDefault();
  fov *= Math.exp(e.deltaY * 0.0012);
  fov = Math.max(20 * Math.PI / 180, Math.min(150 * Math.PI / 180, fov));
  draw();
}, {passive:false});
cvs.addEventListener("dblclick", reset);
addEventListener("resize", resize);
$("reset").onclick = reset;
$("pick").onchange = e => {
  load(e.target.value);
  history.replaceState(null, "", "?pano=" + encodeURIComponent(e.target.value));
};

// nginx serves the mounted tree with autoindex_format json. Panoramas sit at
// <project>/panos/<scene>/<file>, so walk down to them rather than listing one
// directory — the interesting name is the whole path.
const IMG = /\.(png|jpe?g|webp)$/i;

async function ls(path) {
  try {
    const r = await fetch("files/" + path);
    return r.ok ? await r.json() : [];
  } catch (err) { return []; }
}

async function findPanos() {
  const out = [];
  for (const proj of (await ls("")).filter(e => e.type === "directory")) {
    for (const scene of (await ls(`${proj.name}/panos/`))
                          .filter(e => e.type === "directory")) {
      const dir = `${proj.name}/panos/${scene.name}`;
      for (const f of (await ls(dir + "/"))) {
        if (f.type === "file" && IMG.test(f.name)) out.push(`${dir}/${f.name}`);
      }
    }
  }
  return out.sort();
}

findPanos().then(names => {
  const sel = $("pick");
  if (!names.length) {
    sel.innerHTML = "<option>no panoramas found</option>";
    $("meta").textContent =
      "drop equirectangular images into assets/projects/<project>/panos/<scene>/";
    return;
  }
  sel.innerHTML = names.map(n => `<option>${n}</option>`).join("");
  const want = new URLSearchParams(location.search).get("pano");
  sel.value = names.includes(want) ? want : names[0];
  resize();
  load(sel.value);
}).catch(() => { $("meta").textContent = "could not list files/"; });
</script>
