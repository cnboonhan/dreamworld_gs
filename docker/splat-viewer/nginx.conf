server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # splat PLYs are hundreds of MB; don't buffer or time out on them
    sendfile on;
    tcp_nopush on;
    client_max_body_size 0;
    send_timeout 3600s;

    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # mounted scenes: /files/<scene>/world.ply
    location /files/ {
        autoindex on;
        autoindex_format json;      # so the viewer can list projects itself
        add_header Accept-Ranges bytes;
    }
}
